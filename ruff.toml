line-length = 88
target-version = "py313"

exclude = [
    "**/migrations/*.py",
    ".venv",
    "venv",
    "__pycache__",
]

[lint]
select = [
    "A",
    "B",
    "C4",
    "DJ",
    "E",
    "F",
    "I",
    "N",
    "RUF",
    "SIM",
    "UP",
]

ignore = []

fixable = ["ALL"]

[format]
quote-style = "double"
indent-style = "space"